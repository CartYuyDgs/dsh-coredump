name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependencies to install: the package ships plain ESM/JS and the
      # remote engine is plain Python.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS tests (host + client module)
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine tests (offline gdb-output replay)
        run: python3 test/test_engine.py

      - name: Package contents sanity (client + engine must ship)
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'client.js' /tmp/pack.txt
          grep -q 'engine/cdparse.py' /tmp/pack.txt
